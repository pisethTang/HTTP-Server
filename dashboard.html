<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" >
    <meta name="viewport" content="width=device-width, initial-scale=1.0" >
    <title>C++ Server Manager</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body class="bg-gray-50 text-gray-900 font-sans max-w-3xl mx-auto p-6">
    <h1 class="text-3xl font-bold text-slate-800 mb-6">🚀 Server Interface</h1>

    <div class="bg-white border border-gray-200 rounded-lg p-6 mb-6 shadow-sm">
      <h2 class="text-xl font-semibold mb-4">📂 Upload File</h2>
      <form action="/upload" method="POST">
        <textarea
          name="file_content"
          rows="4"
          class="w-full p-3 bg-white border border-gray-300 rounded-md text-sm focus:outline-none focus:ring-2 focus:ring-blue-500"
          placeholder="Type text content here..."
        ></textarea>
        <button
          type="submit"
          class="mt-4 cursor-pointer px-4 py-2 bg-red-500 text-white rounded-md text-sm font-medium hover:bg-red-600 transition-colors"
        >
          Upload
        </button>
      </form>
    </div>

    <div class="bg-white border border-gray-200 rounded-lg p-6 mb-6 shadow-sm">
      <h2 class="text-xl font-semibold mb-4">🗑️ Delete File</h2>
      <p class="mb-4 text-gray-700">Target: <code class="bg-gray-100 px-1.5 py-0.5 rounded text-sm font-mono">uploaded_data.txt</code></p>
      <button
        id="delete-btn"
        type="button"
        class="cursor-pointer px-4 py-2 bg-red-500 text-white rounded-md text-sm font-medium hover:bg-red-600 transition-colors"
      >
        DELETE NOW
      </button>
      <p id="status" class="mt-3 font-bold text-gray-600"></p>
    </div>

    <div class="bg-white border border-gray-200 rounded-lg p-6 shadow-sm">
      <h2 class="text-xl font-semibold mb-4">🍪 Cookie Status</h2>
      <button
        id="cookie-btn"
        type="button"
        class="cursor-pointer px-4 py-2 bg-red-500 text-white rounded-md text-sm font-medium hover:bg-red-600 transition-colors"
      >
        Check My Session
      </button>
      <p id="cookie_display" class="mt-3 text-gray-700"></p>
    </div>

    <script type="module" src="/dist/dashboard.js"></script>
  </body>
</html>
